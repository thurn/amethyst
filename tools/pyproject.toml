[project]
name = "amethyst-tools"
version = "0.1.0"
description = "Amethyst's command line: Unity runs, checks, flags, test metrics and vendor assets"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
am = "amethyst_tools.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["black", "pyre-check", "pytest", "mdformat", "mdformat-gfm"]

[tool.black]
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
